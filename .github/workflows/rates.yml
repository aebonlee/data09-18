# 서울외국환중개 월평균 매매기준율을 (손으로 실행할 때) 받아 data/rates.json · data/rates.js 로 넣습니다(기획서 11.15).
# 값이 바뀐 날(보통 매달 1일 — 지난달 월평균이 새로 나옴)만 커밋합니다.
# GitHub Pages 는 main 루트를 그대로 서빙하므로, 커밋 뒤 Pages 빌드를 한 번 요청해 새 파일이 바로 올라가게 합니다.
name: 환율 받기 (서울외국환중개 월평균)

# 2026-09-30 다섯 번째 답변(기획서 11.17): 매입단가는 완제품정보의 「발주단가(원화)」를 그대로 쓰고 환율은 수강생이 엑셀에 수기 입력합니다.
# 자동 값은 매입단가 계산에 쓰이지 않으므로 매일 받기(schedule: cron '10 0 * * *')를 뺐습니다. 참고 값이 필요할 때만 Actions 화면에서 손으로 실행합니다.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 월평균 매매기준율 받기
        run: node scripts/fetch-rates.mjs
      - name: 바뀌었으면 커밋·푸시
        id: commit
        run: |
          if git diff --quiet -- data/; then
            echo "변경 없음"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json data/rates.js
          git commit -m "환율 자동 갱신 — 서울외국환중개 월평균 매매기준율"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Pages 다시 빌드 요청
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 빌드 요청 실패 — 다음 푸시 때 반영됩니다"
